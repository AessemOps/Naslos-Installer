# Continuous integration: unit tests plus a build against the newest Naslos-Linux
# install pack, so an interface drift between the pack and the engine fails on
# the PR that introduces it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt / vet / test
        run: make check

  pack-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The newest Naslos-Linux vX.Y.Z tag drives the embedded pack; the engine's
      # Talos/schematic gate is derived from that pack's metadata.json.
      - name: Fetch the latest install pack
        id: fetch
        run: |
          if ! ./scripts/fetch-install-pack.sh; then
            echo "::warning::no Naslos-Linux vX.Y.Z release yet; skipping the pack build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build against the embedded pack
        if: steps.fetch.outputs.skip != 'true'
        run: make build
      - name: Show the embedded pack identity
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("installpack/metadata.json"))
          print(f"naslosVersion={m['naslosVersion']} talosVersion={m['talosVersion']} schematicId={m['schematicId']}")
          PY

  # The desktop wizard (Svelte) and the Tauri shell. The shell spawns the engine
  # as a sidecar, so its check builds the engine binary too.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Type-check and build the wizard
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm run build
      # Tauri v2 Linux build dependencies (webkit2gtk-4.1, gtk3, libsoup3, ...).
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the engine sidecar
        run: scripts/build-sidecar.sh
      - name: Check the Tauri shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
