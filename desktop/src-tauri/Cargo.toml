[package]
name = "naslos-installer"
version = "0.1.0"
description = "Naslos desktop installer"
authors = ["AessemOps"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "naslos_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Do NOT set panic = "abort": it turns any panic during WebView2/Tauri init into
# an opaque STATUS_STACK_BUFFER_OVERRUN (0xc0000409) crash on Windows with no
# message (found on the Win11 test VM). Unwinding keeps a readable panic.
strip = true
